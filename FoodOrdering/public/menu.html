<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Restaurant Menu</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 40px; background: #f9f9f9; }
    h1 { color: #d35400; }
    table { width: 60%; border-collapse: collapse; background: #fff; }
    th, td { padding: 12px; border: 1px solid #ddd; text-align: left; }
    th { background-color: #d35400; color: white; }
  </style>
</head>
<body>
  <h1>Menu</h1>
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Food Name</th>
        <th>Category</th>
        <th>Price (₹)</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>1</td>
        <td>Pizza</td>
        <td>Fast Food</td>
        <td>250</td>
      </tr>
      <tr>
        <td>2</td>
        <td>Veg Burger</td>
        <td>Fast Food</td>
        <td>120</td>
      </tr>
      <tr>
        <td>3</td>
        <td>Masala Dosa</td>
        <td>South Indian</td>
        <td>150</td>
      </tr>
    </tbody>
  </table>
</body>
</html>
